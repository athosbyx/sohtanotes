<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>athos</title>
    <style>
        body{
            margin:0;
            background:#fff;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Georgia, serif;
        }
        .container{
            text-align:center;
        }
        img{
            width:500px;
            max-width:90vw;
        }
        p{
            margin-top:20px;
            font-size:18px;
            color:#555;
        }
        img, p{
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .fade-out{
            opacity: 0;
            transform: translateY(10px);
        }
        button{
            margin-top:25px;
            padding:10px 20px;
            font-family:Georgia, serif;
            font-size:14px;
            background:#fff;
            border:1px solid #555;
            color:#555;
            border-radius:6px;
            cursor:pointer;
        }
        button:hover{
            background:#555;
            color:#fff;
        }
        .rodape{
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: Georgia, serif;
        }
        .rodape p{
            margin: 0;
            font-size: 12px;
            color: #bbb;
        }
    </style>
</head>
<body>
<div class="container">
    <img id="foto" src="lain.jpeg">
    <p id="frase">"A beleza também existe no silêncio."</p>
    <br>
    <button onclick="sortear()">aleatório</button>
</div>

<div class="rodape">
    <p>feito por sohta</p>
    <p id="atualizado"></p>
</div>

<script>
    // Adiciona pares de imagem + frase aqui.
    // A imagem tem que estar no mesmo lugar do index.html, com o nome exato.
    const itens = [
        { imagem: "lain.jpeg", frase: "A beleza também existe no silêncio." },
        { imagem: "shiori.jpeg", frase: "eu não entendo sua expressão." },
        { imagem: "Uh.jpeg", frase: "bem rebelde, não é?." },
        { imagem: "gambling.gif", frase: "LET'S GO GAMBLING!" },
    ];

    function sortear(){
        const foto = document.getElementById("foto");
        const frase = document.getElementById("frase");

        foto.classList.add("fade-out");
        frase.classList.add("fade-out");

        setTimeout(() => {
            const escolha = itens[Math.floor(Math.random() * itens.length)];
            foto.src = escolha.imagem;
            frase.textContent = '"' + escolha.frase + '"';

            foto.classList.remove("fade-out");
            frase.classList.remove("fade-out");
        }, 300);
    }

    document.addEventListener("DOMContentLoaded", () => {
        const data = new Date(document.lastModified);
        document.getElementById("atualizado").textContent = "Última vez atualizado: " + data.toLocaleString("pt-BR");
    });
</script>
</body>
</html>
