<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>The Notes</title>
    <style>
        body{
            margin:0;
            background:#fff;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Georgia, serif;
        }
        .container{
            text-align:center;
        }
        img{
            width:500px;
            max-width:90vw;
        }
        a.imagem-link img{
            cursor: pointer;
        }
        p{
            margin-top:20px;
            font-size:18px;
            color:#555;
        }
        img, p{
            transition: opacity 0.3s ease, transform 0.3s ease, color 0.3s ease;
        }
        .fade-out{
            opacity: 0;
            transform: translateY(10px);
        }
        button{
            margin-top:25px;
            padding:10px 20px;
            font-family:Georgia, serif;
            font-size:14px;
            background:#fff;
            border:1px solid #555;
            color:#555;
            border-radius:6px;
            cursor:pointer;
        }
        button:hover{
            background:#555;
            color:#fff;
        }
        .botao-vermelho{
            margin-top:25px;
            padding:14px 30px;
            font-family:Georgia, serif;
            font-size:16px;
            background:#c0392b;
            border:none;
            color:#fff;
            border-radius:6px;
            cursor:pointer;
        }
        .botao-vermelho:hover{
            background:#922b21;
        }
        .rodape{
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: Georgia, serif;
        }
        .rodape p{
            margin: 0;
            font-size: 12px;
            color: #bbb;
        }
        .sugerir{
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-family: Georgia, serif;
            font-size: 11px;
            color: #ccc;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .sugerir:hover{
            color: #888;
        }
        .conquistas-link{
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-family: Georgia, serif;
            font-size: 11px;
            color: #ccc;
            text-decoration: none;
            transition: color 0.3s ease;
            background: none;
            border: none;
            cursor: pointer;
        }
        .conquistas-link:hover{
            color: #888;
        }
        .overlay{
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .overlay.aberto{
            display: flex;
        }
        .painel{
            background: #fff;
            border-radius: 10px;
            padding: 30px;
            max-width: 400px;
            width: 85vw;
            max-height: 70vh;
            overflow-y: auto;
            font-family: Georgia, serif;
            text-align: left;
            position: relative;
        }
        .painel h2{
            font-size: 18px;
            color: #333;
            margin: 0 0 15px 0;
            text-align: center;
        }
        .painel .fechar{
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            font-size: 18px;
            color: #999;
            cursor: pointer;
            font-family: Georgia, serif;
        }
        .painel .fechar:hover{
            color: #555;
        }
        .item-conquista{
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        .item-conquista:last-child{
            border-bottom: none;
        }
        .item-conquista .titulo{
            color: #333;
        }
        .item-conquista .titulo.bloqueado{
            color: #bbb;
        }
        .item-conquista .data{
            font-size: 11px;
            color: #aaa;
            margin-top: 3px;
        }
    </style>
</head>
<body>
<div class="container">
    <span id="foto-wrapper"><img id="foto" src="lain.jpeg"></span>
    <p id="frase">"A beleza também existe no silêncio."</p>
    <br>
    <span id="botao-area">
        <button id="botao-aleatorio" onclick="sortear()">aleatório</button>
    </span>
</div>
<div class="rodape">
    <p>feito por sohta</p>
    <p id="atualizado"></p>
</div>
<a class="sugerir" href="https://forms.gle/NVmTD1NhMUaXYfaf7" target="_blank">sugerir</a>
<button class="conquistas-link" onclick="abrirConquistas()">conquistas</button>

<div class="overlay" id="overlay-conquistas" onclick="fecharConquistasFora(event)">
    <div class="painel">
        <button class="fechar" onclick="fecharConquistas()">✕</button>
        <h2>conquistas</h2>
        <div id="lista-conquistas"></div>
    </div>
</div>
<script>
    // Adiciona pares de imagem + frase aqui.
    // A imagem tem que estar no mesmo lugar do index.html, com o nome exato.
    //
    // Propriedades opcionais:
    //   cor  -> deixa a frase colorida (código hexadecimal, ex: "#e74c3c")
    //   link -> deixa a imagem clicável, abrindo esse link numa aba nova
    //   peso -> "quantos bilhetes" o item tem na rifa do sorteio (padrão é 1).
    //           Aqui embaixo os itens normais usam peso 10, então pra tornar
    //           algo RARO, dá um peso bem menor, tipo 1.
    //
    // ITEM ESPECIAL "botão vermelho":
    //   Ao invés dos campos normais, usa só:  { especial: "botao", peso: 1 }
    //   Quando ele é sorteado, some a imagem/frase/botão aleatório, e aparece
    //   só um botão vermelho. Só volta ao normal quando clica nele.
    //
    //   unico -> se true, depois que a pessoa "achar" esse item uma vez, ele
    //            nunca mais aparece pra ela de novo (fica salvo no navegador
    //            dela, o localStorage). Se ela abrir o site em outro
    //            navegador/celular, ou limpar os dados do navegador, reseta.
    //   id    -> opcional, um nome único pra identificar o item no
    //            localStorage. Se não colocar, o código usa o nome da imagem
    //            (ou "especial") como identificador — mas é mais seguro
    //            colocar um id próprio em itens marcados como "unico".
    //   conquista -> nome que aparece na aba de "conquistas" quando a pessoa
    //                acha esse item. Só faz sentido em itens com unico:true —
    //                sem isso, o item não aparece na lista de conquistas.
    const itens = [
        { imagem: "lain.jpeg", frase: "A beleza também existe no silêncio.", peso: 10 },
        { imagem: "shiori.jpeg", frase: "eu não entendo sua expressão.", peso: 10 },
        { imagem: "Uh.jpeg", frase: "bem rebelde, não é?.", peso: 10 },
        { imagem: "gambling.gif", frase: "LET'S GO GAMBLING!", cor: "#d4a017", peso: 10 },
        { imagem: "ouvino.jpeg", frase: "as vezes, fingir que não está ouvindo algo, pode te ajudar, tente.", peso: 10 },
        { imagem: "limbus-company-project-moon.gif", frase: "vroom vroom", peso: 10 },
        { imagem: "tenor.gif", frase: "musgo", peso: 10 },
        { especial: "botao", peso: 1, unico: true, id: "botao-vermelho", conquista: "o botão vermelho" },
    ];

    // identifica um item de forma única (usa id, ou nome da imagem, ou "especial")
    function itemId(item){
        return "achado_" + (item.id || item.imagem || item.especial || JSON.stringify(item));
    }

    function jaFoiAchado(item){
        return localStorage.getItem(itemId(item)) === "1";
    }

    function marcarComoAchado(item){
        localStorage.setItem(itemId(item), "1");
        if (!localStorage.getItem(itemId(item) + "_data")) {
            localStorage.setItem(itemId(item) + "_data", new Date().toLocaleString("pt-BR"));
        }
    }

    function sortearItem(){
        // remove da lista os itens "únicos" que a pessoa já achou antes
        let disponiveis = itens.filter(item => !(item.unico && jaFoiAchado(item)));

        // se por acaso tudo já foi achado (edge case raro), usa a lista inteira
        if (disponiveis.length === 0) {
            disponiveis = itens;
        }

        const pesoTotal = disponiveis.reduce((soma, item) => soma + (item.peso || 1), 0);
        let aleatorio = Math.random() * pesoTotal;

        for (const item of disponiveis) {
            aleatorio -= (item.peso || 1);
            if (aleatorio < 0) {
                return item;
            }
        }
    }

    function renderizar(item){
        const wrapper = document.getElementById("foto-wrapper");
        const frase = document.getElementById("frase");
        const botaoArea = document.getElementById("botao-area");

        // se o item é "único", marca como achado assim que aparece
        if (item.unico) {
            marcarComoAchado(item);
        }

        // item especial: some tudo, mostra só o botão vermelho
        if (item.especial === "botao") {
            wrapper.innerHTML = "";
            frase.textContent = "";
            botaoArea.innerHTML = '<button class="botao-vermelho" onclick="voltar()">?</button>';
            return;
        }

        if (item.link) {
            wrapper.innerHTML = '<a class="imagem-link" href="' + item.link + '" target="_blank"><img id="foto" src="' + item.imagem + '"></a>';
        } else {
            wrapper.innerHTML = '<img id="foto" src="' + item.imagem + '">';
        }

        frase.textContent = '"' + item.frase + '"';
        frase.style.color = item.cor ? item.cor : "#555";
    }

    // chamado ao clicar no botão vermelho: volta ao normal
    function voltar(){
        const botaoArea = document.getElementById("botao-area");
        botaoArea.innerHTML = '<button id="botao-aleatorio" onclick="sortear()">aleatório</button>';
        sortear();
    }

    function sortear(){
        const wrapper = document.getElementById("foto-wrapper");
        const frase = document.getElementById("frase");

        wrapper.classList.add("fade-out");
        frase.classList.add("fade-out");

        setTimeout(() => {
            const escolha = sortearItem();
            renderizar(escolha);

            wrapper.classList.remove("fade-out");
            frase.classList.remove("fade-out");
        }, 300);
    }

    document.addEventListener("DOMContentLoaded", () => {
        const data = new Date(document.lastModified);
        document.getElementById("atualizado").textContent = "Última vez atualizado: " + data.toLocaleString("pt-BR");
    });

    function preencherConquistas(){
        const lista = document.getElementById("lista-conquistas");
        lista.innerHTML = "";

        // só entram na lista os itens marcados como "unico" que tenham "conquista"
        const conquistaveis = itens.filter(item => item.unico && item.conquista);

        if (conquistaveis.length === 0) {
            lista.innerHTML = '<p style="text-align:center; color:#999; font-size:13px;">nenhuma conquista cadastrada ainda.</p>';
            return;
        }

        conquistaveis.forEach(item => {
            const achado = jaFoiAchado(item);
            const div = document.createElement("div");
            div.className = "item-conquista";

            const titulo = document.createElement("div");
            titulo.className = "titulo" + (achado ? "" : " bloqueado");
            titulo.textContent = achado ? item.conquista : "???";
            div.appendChild(titulo);

            if (achado) {
                const dataEl = document.createElement("div");
                dataEl.className = "data";
                dataEl.textContent = "desbloqueado em " + localStorage.getItem(itemId(item) + "_data");
                div.appendChild(dataEl);
            }

            lista.appendChild(div);
        });
    }

    function abrirConquistas(){
        preencherConquistas();
        document.getElementById("overlay-conquistas").classList.add("aberto");
    }

    function fecharConquistas(){
        document.getElementById("overlay-conquistas").classList.remove("aberto");
    }

    // fecha o painel se a pessoa clicar fora dele (no fundo escuro)
    function fecharConquistasFora(evento){
        if (evento.target.id === "overlay-conquistas") {
            fecharConquistas();
        }
    }
</script>
</body>
</html>
